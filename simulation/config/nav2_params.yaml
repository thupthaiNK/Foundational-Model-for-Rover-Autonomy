# Nav2 stack configuration for the D1 traversability-costmap waypoint
# experiment. No AMCL/map_server — localization is ground-truth odometry
# from the existing libgazebo_ros_diff_drive plugin plus an identity
# map->odom static transform (see simulation/launch/nav2_waypoint_test.launch.py).
# Only navigation_launch.py (not the full bringup_launch.py) is used.
#
# navigation_launch.py (verified against the installed
# /opt/ros/humble/share/nav2_bringup/launch/navigation_launch.py) also starts
# smoother_server and velocity_smoother as lifecycle nodes. They are
# intentionally left unconfigured here (no section below) and run on Nav2's
# built-in defaults — this experiment does not depend on path smoothing
# behaviour, only on the controller reaching the goal and replanning when the
# costmap changes.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    # ControllerServer subscribes to its own odom_topic (independent of
    # bt_navigator's) for DWB velocity feedback (RotateToGoal/Oscillation
    # critics). Default is plain "odom", which has zero publishers here —
    # the real odometry is /exomy/odom (see bt_navigator.odom_topic below).
    # Without this, the controller never receives velocity feedback and
    # spins in place forever without detecting rotation completion.
    odom_topic: /exomy/odom

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      # Raised from the 15.0s default: this dev machine (4 cores, WSL2) runs
      # Gazebo + CPU-only DINOv2 inference + full Nav2 concurrently and is
      # CPU-oversubscribed (observed load average 5.4-6.4), so real robot
      # motion is genuine but slow. At 15.0s the checker fired false-positive
      # timeouts mid-progress (TF-confirmed yaw/position advancing) and
      # triggered a Spin recovery that regressed distance_remaining instead
      # of helping. See .superpowers/sdd/task-6-report.md.
      movement_time_allowance: 60.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.10        # matches the existing 0.10 m/s soil-speed ceiling
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      min_speed_theta: 0.0
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true   # Condition B starts all-free, not unknown, but
                             # this is a safe default if that ever changes.

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /exomy/odom
    # default_nav_to_pose_bt_xml intentionally omitted — setting it to an
    # empty string would make bt_navigator try to load an empty path
    # instead of falling back to its compiled-in default tree.
    # default_server_timeout: nav2_behavior_tree's BT action-server nodes
    # (ComputePathToPose, FollowPath, ...) use this to wait for the action
    # server to acknowledge a new goal request. The library default is
    # 20ms (see /opt/ros/humble/include/nav2_behavior_tree/
    # bt_action_server_impl.hpp) — the same value nav2_bringup's stock
    # params.yaml also uses. That is too tight for this thesis's setup:
    # a CPU-only DINOv2 inference node runs continuously alongside
    # Gazebo + the full Nav2 stack on a 4-core dev machine, and observed
    # "Control loop missed its desired rate of 10.0000Hz" warnings show
    # the control loop is frequently CPU-starved, causing goal-request
    # acks to arrive after the 20ms window and the whole navigate_to_pose
    # BT to abort with "Goal failed" even though the controller/planner
    # eventually respond. 2000ms gives enough margin for this environment
    # without masking a genuinely unresponsive server.
    default_server_timeout: 2000

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 5
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.1
      width: 30
      height: 24
      origin_x: -15.0
      origin_y: -12.0
      track_unknown_space: false
      robot_radius: 0.25     # ExoMy ~392x300mm footprint, see project_exomy_hardware memory
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /traversability_costmap
        subscribe_to_updates: true
        map_subscribe_transient_local: true
        # REQUIRED false: Nav2's default trinary_costmap collapses every
        # OccupancyGrid value that isn't exactly 0/100/-1 to free space,
        # which would silently erase the sand(35)/bedrock(65) cost gradient.
        trinary_costmap: false
        lethal_cost_threshold: 100
        unknown_cost_value: -1

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      track_unknown_space: false
      robot_radius: 0.25
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /traversability_costmap
        subscribe_to_updates: true
        map_subscribe_transient_local: true
        trinary_costmap: false   # see global_costmap comment above
        lethal_cost_threshold: 100
        unknown_cost_value: -1
